name: "Scheduled Regression- SS"
on:
  #  schedule:
  #    cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  build:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      STUB_URL: ${{ secrets.STUB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      # Authenticate BEFORE the test run — our GCPLogging reporter writes to Cloud
      # Logging live, as tests finish (onTestEnd/onExit), not as a separate step
      # after a known failure. Credentials must already be in place when
      # `npx playwright test` starts, unconditionally (no if: failure() here).
      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/64414338682/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: ci-log-writer@project-63ef1455-43c3-461c-a63.iam.gserviceaccount.com
      - run: npx playwright install --with-deps
      - run: npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          path: playwright-report/
          name: playwright-report

name: "Scheduled Regression- SS"
on:
  #  schedule:
  #    cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  build:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      STUB_URL: ${{ secrets.STUB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          path: playwright-report/
          name: playwright-report
      #This ONE step does the WHOLE handshake: requests GitHub's token, sends it to Google, gets back Google's own credential — all in one action. It's really "authenticate to GCP," not just "generate a token.
      - name: the whole auth handshake (token + exchange, in one step)
        uses: google-github-actions/auth@v2
        if: failure()
        with:
          workload_identity_provider: projects/64414338682/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: ci-log-writer@project-63ef1455-43c3-461c-a63.iam.gserviceaccount.com

      #this does NOT do any authentication at all. Its ONLY job is installing the gcloud COMMAND-LINE TOOL onto the runner, so step 3 can actually run gcloud commands
      - name: install the gcloud CLI tool (no auth involved at all)
        uses: google-github-actions/setup-gcloud@v2
        if: failure()

      - name: gcloud CLI to write the log entry
        run: gcloud logging write ci-failures "Playwright suite failed" --severity=ERROR
        if: failure()
